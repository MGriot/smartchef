server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Recipe import (/api/recipes/parse) calls a local LLM that can take
        # several minutes on CPU-only inference (measured ~3.5 tok/s, no GPU)
        # — default 60s read timeout was cutting it off with a 504 well
        # before the backend's own 400s AbortSignal had a chance to resolve.
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    # Proxy uploaded images to backend
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend health check — used by the native app's "connect to server"
    # screen to confirm it's really talking to a SmartChef instance before
    # saving the address. Without this it fell through to the SPA fallback
    # below and got index.html back instead of JSON.
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
