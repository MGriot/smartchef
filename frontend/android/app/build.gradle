apply plugin: 'com.android.application'

// ── Release signing ────────────────────────────────────────────────────
// The keystore and its passwords are deliberately NOT in this file. They
// come from keystore.properties (gitignored, next to this module or at the
// android/ root) or from the environment, so the secret lives on the
// machine that builds releases and nowhere in git.
//
//   keystore.properties:
//     storeFile=../../release.jks      # relative to this build.gradle
//     storePassword=...
//     keyAlias=release-alias
//     keyPassword=...
//
//   or: SMARTCHEF_KEYSTORE / SMARTCHEF_KEYSTORE_PASSWORD /
//       SMARTCHEF_KEY_ALIAS / SMARTCHEF_KEY_PASSWORD
//
// When neither is present the release build stays UNSIGNED rather than
// failing: a contributor without the key can still run assembleRelease,
// and `assembleDebug` is unaffected either way.
def keystoreProps = new Properties()
def keystorePropsFile = [
    file('keystore.properties'),
    rootProject.file('keystore.properties'),
].find { it.exists() }
if (keystorePropsFile != null) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String propKey, String envKey ->
    def fromEnv = System.getenv(envKey)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProps.getProperty(propKey)
}

// A relative storeFile is resolved against the directory holding
// keystore.properties, which is what someone editing that file expects.
// Resolving it against this module instead (Gradle's own default for
// file()) silently pointed one level too shallow and produced an UNSIGNED
// apk with only a warning to say so.
def storeFilePath = signingValue('storeFile', 'SMARTCHEF_KEYSTORE')
def resolvedStoreFile = null
if (storeFilePath != null && !storeFilePath.isEmpty()) {
    def candidate = new File(storeFilePath)
    if (candidate.isAbsolute()) {
        resolvedStoreFile = candidate
    } else {
        def bases = []
        if (keystorePropsFile != null) bases << keystorePropsFile.parentFile
        bases << projectDir
        bases << rootProject.projectDir
        resolvedStoreFile = bases.collect { new File(it, storeFilePath) }.find { it.exists() }
                            ?: new File(projectDir, storeFilePath)
    }
}
def hasReleaseKey = resolvedStoreFile != null && resolvedStoreFile.exists()
if (storeFilePath != null && !storeFilePath.isEmpty() && !hasReleaseKey) {
    logger.error("SmartChef: release keystore '${storeFilePath}' not found (looked for ${resolvedStoreFile}) - the release APK will be UNSIGNED")
}

android {
    namespace = "com.smartchef.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.smartchef.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.7.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile resolvedStoreFile
                storePassword signingValue('storePassword', 'SMARTCHEF_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SMARTCHEF_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'SMARTCHEF_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            // Left off deliberately. R8 renames and strips by reachability,
            // and this app's Capacitor plugins - including the two written
            // for it, SafMirrorPlugin and GitHttpPlugin - are resolved by
            // NAME at runtime, so nothing static references the classes it
            // would remove. `assembleRelease` already clears
            // android:debuggable and testOnly, which is what the store
            // requirements actually ask for; minification buys size at the
            // cost of a failure mode that only shows up on a device.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // SafMirrorPlugin (custom, app-specific — see SafMirrorPlugin.java)
    // resolves SAF tree entries via DocumentFile.
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
