# Pinned explicitly so `podman compose` resolves to the same project (and
# therefore the same data volumes) whether invoked from this folder or via
# the thin root-level docker-compose.yml — otherwise the default project
# name is derived from the *invoking* directory name, and running from a
# different location would spin up a second, empty stack instead of
# reusing the existing one. "docker" matches the project name already in
# use by the live volumes (docker_pg_data etc.) from this folder being the
# original place the stack was started from.
name: docker

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: smartchef_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartchef
      POSTGRES_USER: smartchef
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartchef_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartchef"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: smartchef_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://smartchef:${DB_PASSWORD:-smartchef_secret}@db:5432/smartchef
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:4b
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      SESSION_SECRET: ${SESSION_SECRET:-smartchef-dev-secret-change-me}
      # Session cookie behavior. Defaults preserve today's plain-HTTP,
      # same-origin (browser via nginx) setup exactly. Only needed once a
      # native app or another cross-origin client talks to the API
      # directly (e.g. over Tailscale) — see docker/.env.example.
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Leaving this at the default "*" breaks login from the native app
      # (or any cross-origin client) with a generic "Failed to fetch" —
      # see the CORS_ORIGIN warning in docker/.env.example.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Folder-based multi-device sync (Tenth slice) — disabled by default,
      # zero behavior change for single-device use. SYNC_FOLDER_HOST_PATH
      # should point at a real folder on the host, e.g. one kept in sync by
      # OneDrive/Google Drive's own desktop client — SmartChef only reads/
      # writes files there, the OS-level client handles getting them to
      # another device. DEVICE_NAME is this instance's friendly label in
      # the peer list; DEVICE_ID is auto-generated and persisted on first
      # boot if left unset.
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      SYNC_FOLDER: /app/sync
      DEVICE_NAME: ${DEVICE_NAME:-SmartChef Device}
      # Encrypts cloud LLM API keys (Anthropic/Gemini/OpenAI, opted into
      # per-account in Account settings) before storing them in the DB —
      # only relevant if you select a cloud provider for recipe-import
      # parsing; local Ollama needs none of this. See docker/.env.example.
      LLM_KEY_ENCRYPTION_SECRET: ${LLM_KEY_ENCRYPTION_SECRET:-smartchef-dev-encryption-secret-change-me}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - uploads_data:/app/uploads
      - device_data:/app/device
      - ${SYNC_FOLDER_HOST_PATH:-../sync-data}:/app/sync
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ── MCP Server (Model Context Protocol) ────────────────────────────────
  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    container_name: smartchef_mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - backend

  # ── Frontend Web ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smartchef_frontend
    restart: unless-stopped
    ports:
      # 8888, not the more obvious 8080: Windows/WinNAT reserves TCP port
      # ranges dynamically, and on this host 7981-8080 (plus 8081-8180,
      # 8181-8280, 8281-8380 and 8407-8506) are excluded, so nothing on the
      # host — including WSL's port relay — can bind 8080. The container
      # served fine inside the VM the whole time; only the host side was
      # dead, which reads exactly like a broken deploy. Check the current
      # reservations with:
      #   netsh interface ipv4 show excludedportrange protocol=tcp
      # `tailscale serve` must point at the same port — see docker/.env.
      - "8888:80"
    depends_on:
      - backend

  # ── Ollama AI Engine ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: smartchef_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pg_data:
  ollama_data:
  uploads_data:
  device_data:

networks:
  default:
    name: smartchef_network
