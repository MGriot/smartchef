# Ready to copy into a fork of https://gitlab.com/fdroid/fdroiddata as
# metadata/com.smartchef.app.yml — see ../README.md for the submission steps.
#
# The unusual part of this recipe is that the APK is a Capacitor shell around
# a Vite build, so Node has to run before Gradle does and F-Droid's build
# server has no Node by default. That goes in `sudo:` (root, in the build VM)
# and `build:` — NOT `prebuild:`, because F-Droid's source scanner runs
# between the two and `npm ci` would drop a node_modules full of binaries
# straight into its path.
#
# `init`, `prebuild` and `build` all run inside `subdir:`, which is why the
# build block starts with `cd ../..` — that lands in frontend/, where
# package.json lives.

Categories:
  - Internet
License: MIT
AuthorName: Matteo Griot
SourceCode: https://github.com/MGriot/smartchef
IssueTracker: https://github.com/MGriot/smartchef/issues
Changelog: https://github.com/MGriot/smartchef/releases

AutoName: SmartChef

RepoType: git
Repo: https://github.com/MGriot/smartchef.git

Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: v1.1.0
    subdir: frontend/android/app
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz
      # From https://nodejs.org/dist/v20.18.1/SHASUMS256.txt — an unverified
      # download is something a reviewer will ask about, and `fdroid build`
      # is right not to vouch for one.
      - echo "c6fa75c841cbffac851678a472f2a5bd612fff8308ef39236190e1f8dbb0e567  node.tar.xz" | sha256sum -c -
      - tar xJf node.tar.xz -C /opt
      - ln -s /opt/node-v20.18.1-linux-x64/bin/node /usr/local/bin/node
      - ln -s /opt/node-v20.18.1-linux-x64/bin/npm /usr/local/bin/npm
    build:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes

# The optional cloud language models (Anthropic/Gemini/OpenAI) are off by
# default — the default is a local Ollama — but they are non-free network
# services, so this is declared rather than waited to be asked about.
AntiFeatures:
  - NonFreeNet

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 2
